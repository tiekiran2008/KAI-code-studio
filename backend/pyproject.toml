[project]
name = "agent-backend"
version = "0.1.0"
description = "FastAPI Backend for Software Engineering AI Agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.27",
    "gitpython>=3.1.42",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "networkx>=3.2.1",
    "onnxruntime>=1.17.0",
    "tokenizers>=0.15.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "qdrant-client>=1.8.0",
    "google-genai>=0.1.0",
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    "tenacity>=8.3.0",
    "langgraph>=0.1.0",
    "supabase>=2.4.5",
    "supabase-auth>=2.4.5",
    "PyJWT>=2.8.0",
    "email-validator>=2.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0"
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]