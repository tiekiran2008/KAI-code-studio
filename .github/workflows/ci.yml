name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# ---------------------------------------------------------------------------
# Global defaults
# ---------------------------------------------------------------------------
env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # =========================================================================
  # BACKEND — lint + type-check + tests
  # =========================================================================
  backend-checks:
    name: "Backend — Lint, Type-check & Tests"
    runs-on: ubuntu-latest

    # -----------------------------------------------------------------------
    # Infrastructure services required by integration tests
    # -----------------------------------------------------------------------
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agent_user
          POSTGRES_PASSWORD: agent_password
          POSTGRES_DB: agent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_user -d agent_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.8.4
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c 'curl -sf http://localhost:6333/readyz || exit 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 15s

    # -----------------------------------------------------------------------
    # Environment variables — CI-safe credentials only.
    # External paid APIs (Gemini, Supabase) are intentionally left empty;
    # every test that touches them uses mocks or skips automatically.
    # -----------------------------------------------------------------------
    env:
      ENVIRONMENT: ci
      POSTGRES_URL: postgresql://agent_user:agent_password@localhost:5432/agent_db
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333

      # Auth — bypass so integration tests don't require a real Supabase JWT
      DEV_AUTH_BYPASS: "true"
      DEV_AUTH_USER_EMAIL: ci-user@example.com
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_JWT_SECRET: ""

      # LLM — empty; all agent/RAG tests that call the LLM use mocks
      GEMINI_API_KEY: ""
      OPENAI_API_KEY: ""
      LLM_PROVIDER: gemini

      # Memory / RAG defaults (match config.py defaults)
      MEMORY_ENCRYPTION_KEY: ""
      MEMORY_VECTOR_DIM: "384"
      MEMORY_VECTOR_COLLECTION: memories
      WORKSPACE_ROOT: ./workspace

      CORS_ORIGINS: '["http://localhost:3000"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # -----------------------------------------------------------------------
      # Lint
      # -----------------------------------------------------------------------
      - name: Ruff — lint
        working-directory: backend
        run: ruff check src/

      # -----------------------------------------------------------------------
      # Type-check
      # mypy strict is configured in pyproject.toml; continue-on-error until
      # all third-party stub packages are complete.
      # -----------------------------------------------------------------------
      - name: Mypy — type-check
        working-directory: backend
        run: mypy src/
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Test suites
      # -----------------------------------------------------------------------
      - name: Pytest — unit tests
        working-directory: backend
        run: |
          pytest tests/unit -q --tb=short --junit-xml=test-results/unit.xml

      - name: Pytest — RAG tests
        working-directory: backend
        run: |
          pytest tests/rag -q --tb=short --junit-xml=test-results/rag.xml

      - name: Pytest — agent tests
        working-directory: backend
        run: |
          pytest tests/agents -q --tb=short --junit-xml=test-results/agents.xml

      - name: Pytest — memory tests
        working-directory: backend
        run: |
          pytest tests/memory -q --tb=short --junit-xml=test-results/memory.xml

      - name: Pytest — tools tests
        working-directory: backend
        run: |
          pytest tests/tools -q --tb=short --junit-xml=test-results/tools.xml

      - name: Pytest — integration tests
        working-directory: backend
        run: |
          pytest tests/integration -q --tb=short --junit-xml=test-results/integration.xml

      - name: Pytest — root-level test files
        working-directory: backend
        run: |
          pytest tests/test_health.py tests/test_indexing.py tests/test_parser.py \
            -q --tb=short --junit-xml=test-results/root.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results/

  # =========================================================================
  # FRONTEND — lint + Vitest + production build
  # =========================================================================
  frontend-checks:
    name: "Frontend — Lint, Tests & Production Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (clean install)
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Vitest — unit tests
        working-directory: frontend
        run: npm test -- --run
        env:
          # Vite build-time vars — placeholder values safe for CI.
          # All tests mock the API layer; no real Supabase calls are made.
          VITE_API_BASE_URL: http://localhost:8000
          VITE_API_PREFIX: /api/v1
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Production build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_API_PREFIX: /api/v1
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # =========================================================================
  # DOCKER — verify production images build successfully
  # Runs only after both backend and frontend jobs succeed.
  # =========================================================================
  docker-build:
    name: "Docker — Build Verification"
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: kai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: kai-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000
            VITE_API_PREFIX=/api/v1
            VITE_SUPABASE_URL=https://placeholder.supabase.co
            VITE_SUPABASE_ANON_KEY=placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max

