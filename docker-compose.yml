# =============================================================================
# KAI Code Studio — Docker Compose (Development + Production-like Stack)
# =============================================================================
#
# Usage:
#   Development (Vite dev server):
#     Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
#   Production-like (nginx, compiled bundle):
#     Use: docker-compose up --build
#
# This file (docker-compose.yml) targets the PRODUCTION frontend image.
# It builds the Vite bundle at image build time and serves it via nginx.
# VITE_* variables must be passed as build-args; they are baked into the
# static JS bundle and cannot be changed at runtime.
#
# Secrets: never commit .env files. Copy backend/.env.example → backend/.env
# and frontend/.env.example → frontend/.env and fill in your own values.
# =============================================================================


services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: agent_password
      POSTGRES_DB: agent_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_user -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "pidof qdrant || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_URL: "postgresql://agent_user:agent_password@postgres:5432/agent_db"
      REDIS_URL: "redis://redis:6379/0"
      QDRANT_URL: "http://qdrant:6333"
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:80","http://localhost"]'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/workspace:/app/workspace

  # ---------------------------------------------------------------------------
  # Frontend — Production image (nginx:alpine serving the compiled Vite bundle)
  #
  # VITE_* variables are build-time ARGs baked into the JS bundle at build time.
  # They cannot be changed at container runtime — rebuild the image if they change.
  #
  # nginx.conf proxies /api/* → http://backend:8000 internally, so the browser
  # only ever needs to call the frontend host (no localhost:8000 in the browser).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # API base URL is empty because nginx proxies /api/* to the backend
        # container internally — the browser calls the same origin as the UI.
        VITE_API_BASE_URL: ""
        VITE_API_PREFIX: /api/v1
        # Supabase public values — safe to embed in the frontend bundle.
        # Override by setting VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY
        # as environment variables before running docker-compose build.
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  qdrant_data: