# =============================================================================
# KAI Code Studio — Nginx SPA Configuration
# =============================================================================
# Serves the Vite production build from /usr/share/nginx/html.
#
# SPA routing: all unmatched paths fall back to index.html so React Router
# handles navigation client-side (no 404 on hard refresh of /auth/login, etc.)
#
# API proxy: /api/* is forwarded to the backend container using its Docker
# Compose service name ("backend"), never "localhost" (which would loop back
# inside the nginx container itself).
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------------
    # Static assets — long-lived cache for Vite hashed filenames (e.g. index-abc123.js)
    # ---------------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # API proxy — forward all /api requests to the FastAPI backend.
    # "backend" is the Docker Compose service name; Docker's internal DNS
    # resolves it to the correct container IP.
    # ---------------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ---------------------------------------------------------------------------
    # SPA fallback — serves index.html for any path not matched above so that
    # React Router handles client-side routing without 404s.
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------------
    # Health check endpoint for container orchestrators
    # ---------------------------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
